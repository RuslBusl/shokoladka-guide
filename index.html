
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f8f0f3">
  <title>SHOKOLADKA — Путеводитель</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #f8f0f3;
      font-family: Arial, sans-serif;
    }
    header {
      padding: 12px 16px;
      text-align: center;
      color: #67384d;
      background: #f8f0f3;
      font-weight: bold;
    }
    main {
      height: calc(100dvh - 46px);
      width: 100%;
    }
    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: white;
    }
    .fallback {
      padding: 20px;
      text-align: center;
      color: #67384d;
    }
    .fallback a { color: #67384d; }
  </style>
</head>
<body>
  <header>SHOKOLADKA ♡ Путеводитель</header>
  <main>
    <iframe
      src="./guide.pdf"
      title="Путеводитель SHOKOLADKA">
    </iframe>
    <noscript>
      <div class="fallback">
        <a href="./guide.pdf">Открыть путеводитель PDF</a>
      </div>
    </noscript>
  </main>
</body>
</html>
