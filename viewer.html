
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f8f0f3">
  <title>SHOKOLADKA — Путеводитель</title>
  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: #f8f0f3;
      color: #67384d;
      font-family: Arial, sans-serif;
    }

    body {
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    header {
      padding: 14px 10px;
      text-align: center;
      font-weight: bold;
      position: sticky;
      top: 0;
      z-index: 2;
      background: #f8f0f3;
    }

    #status {
      padding: 12px;
      text-align: center;
    }

    #pages {
      width: 100%;
      padding: 0 6px 24px;
    }

    .page {
      display: block;
      width: 100%;
      height: auto;
      margin: 0 auto 12px;
      background: white;
      box-shadow: 0 1px 5px #0002;
    }

    .fallback {
      display: block;
      margin: 12px;
      padding: 14px;
      color: #67384d;
      background: white;
      border-radius: 10px;
      text-align: center;
    }
  </style>
</head>
<body>
  <header>SHOKOLADKA ♡ Путеводитель</header>
  <div id="status">Загружаем путеводитель…</div>
  <main id="pages"></main>
  <a class="fallback" href="./guide.pdf" target="_blank" rel="noopener">
    Открыть оригинальный PDF отдельно
  </a>

  <script type="module">
    import * as pdfjsLib from
      'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs';

    pdfjsLib.GlobalWorkerOptions.workerSrc =
      'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.worker.min.mjs';

    const status = document.getElementById('status');
    const pages = document.getElementById('pages');

    async function showPDF() {
      try {
        const pdf = await pdfjsLib.getDocument('./guide.pdf').promise;
        status.textContent = `Страниц: ${pdf.numPages}`;

        for (let number = 1; number <= pdf.numPages; number++) {
          const page = await pdf.getPage(number);
          const base = page.getViewport({ scale: 1 });
          const scale = Math.min(
            (window.innerWidth - 12) / base.width,
            1.8
          );
          const viewport = page.getViewport({ scale });
          const canvas = document.createElement('canvas');
          const context = canvas.getContext('2d');

          canvas.width = Math.floor(viewport.width);
          canvas.height = Math.floor(viewport.height);
          canvas.className = 'page';
          canvas.style.width = '100%';
          canvas.style.height = 'auto';

          pages.appendChild(canvas);

          await page.render({
            canvasContext: context,
            viewport
          }).promise;
        }

        status.textContent = 'Путеводитель SHOKOLADKA';
      } catch (error) {
        console.error(error);
        status.textContent =
          'Не удалось отобразить страницы. Используйте ссылку на оригинальный PDF ниже.';
      }
    }

    showPDF();
  </script>
</body>
</html>
